# Item Tracker: one container, reachable only from this computer.
# Start:  docker compose up -d     Open: http://localhost:4242
# Update: docker compose pull && docker compose up -d
# Stop:   docker compose down      (your data stays in the itemtracker_item-tracker-data volume)
# The project name keeps the volume the same whatever folder this file is in,
# and matches install/install.cmd, so both find the same desk.
name: itemtracker
services:
  item-tracker:
    image: ghcr.io/delta-43/item_tracker:latest
    container_name: item-tracker
    restart: always
    ports:
      # Bound to 127.0.0.1 so other devices on the network cannot reach the desk.
      - "127.0.0.1:4242:4242"
    volumes:
      - item-tracker-data:/data

volumes:
  item-tracker-data:
